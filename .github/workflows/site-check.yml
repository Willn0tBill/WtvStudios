name: Wtv Innovations Website Checks

on:
  push:
    paths:
      - '*.html'
      - 'css/**'
      - 'js/**'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/site-check.yml'
  pull_request:
    paths:
      - '*.html'
      - 'css/**'
      - 'js/**'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/site-check.yml'
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scripts parse
        run: node --check js/script.js
      - name: Smoke test published portfolio
        run: node --test tests/*.test.mjs
